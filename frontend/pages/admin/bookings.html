<!-- Administrator Bookings Moderation Screen
Displays customer bookings with status filtering, passenger totals, and approval/rejection actions.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Management — Kiwi Trails Admin</title>
  <link rel="stylesheet" href="/frontend/css/base.css">
  <link rel="stylesheet" href="/frontend/css/layout.css">
  <link rel="stylesheet" href="/frontend/css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/frontend/pages/admin/dashboard.html" class="brand-link">
        <span>🌿 Kiwi Trails Staff</span>
        <span class="brand-badge">Kaitiaki Console</span>
      </a>
      <nav class="site-nav">
        <a href="/frontend/pages/admin/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/frontend/pages/admin/tours.html" class="nav-link">Tours</a>
        <a href="/frontend/pages/admin/departures.html" class="nav-link">Departures</a>
        <a href="/frontend/pages/admin/bookings.html" class="nav-link active">Bookings</a>
        <a href="/frontend/pages/admin/attendance.html" class="nav-link">Attendance</a>
        <a href="/frontend/pages/admin/coupons.html" class="nav-link">Coupons</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <span class="badge badge-kaitiaki">Reservations Workflow</span>
        <h1 style="margin-top: 0.25rem; margin-bottom: 0;">Customer Booking Requests</h1>
      </div>
    </div>

    <div class="card" style="padding: 1rem 1.5rem; margin-bottom: 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button id="btn-filter-all" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">All Statuses</button>
      <button id="btn-filter-pending" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Pending Review</button>
      <button id="btn-filter-approved" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Approved</button>
      <button id="btn-filter-cancelled" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Cancelled</button>
    </div>

    <div class="card" style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem;">
        <thead>
          <tr style="background: #F8FAF9; border-bottom: 1px solid var(--color-border); color: var(--color-primary);">
            <th style="padding: 1rem 1.25rem;">Reference</th>
            <th style="padding: 1rem 1.25rem;">Customer</th>
            <th style="padding: 1rem 1.25rem;">Tour</th>
            <th style="padding: 1rem 1.25rem;">Travellers</th>
            <th style="padding: 1rem 1.25rem;">Amount</th>
            <th style="padding: 1rem 1.25rem;">Status</th>
            <th style="padding: 1rem 1.25rem; text-align: right;">Decision</th>
          </tr>
        </thead>
        <tbody id="bookings-table-body"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Kiwi Trails Staff Portal (Team Qubit). All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="/frontend/js/pages/admin/bookings.js"></script>
</body>
</html>
