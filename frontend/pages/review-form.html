<!-- Customer Tour Feedback & Review Screen
Submits 5-star ratings and experiential comments to /reviews for completed bookings.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Feedback | Kiwi Trails</title>
  <link rel="stylesheet" href="/frontend/css/base.css">
  <link rel="stylesheet" href="/frontend/css/layout.css">
  <link rel="stylesheet" href="/frontend/css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/frontend/index.html" class="brand-link">
        <span style="display:inline-flex; align-items:center; gap:0.4rem;"><svg class="icon icon-stroke" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 4 13a7 7 0 0 1 7-7c2.5 0 4.8 1.3 6.1 3.3.4.6.9 1 1.6 1.1 2 .4 3.3 2.1 3.3 4.1a4.5 4.5 0 0 1-4.5 4.5c-1.3 0-2.5-.5-3.5-1.4M11 20v-9"/></svg> Kiwi Trails</span>
        <span class="brand-badge">Ara Aotearoa</span>
      </a>
      <nav class="site-nav">
        <a href="/frontend/index.html" class="nav-link">Home</a>
        <a href="/frontend/pages/tour-list.html" class="nav-link">Tours</a>
        <a href="/frontend/pages/my-bookings.html" class="nav-link">My Bookings</a>
        <a href="/frontend/pages/profile.html" class="nav-link">Profile</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="form-card" style="max-width: 580px;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-tikanga">Manaakitanga & Experience</span>
        <h2 style="margin-top: 0.5rem; margin-bottom: 0.25rem;">Share Your Experience</h2>
        <p style="color: var(--color-text-muted); font-size: 0.9rem;">Your feedback helps our Kaitiaki guides uphold conservation and cultural excellence.</p>
      </div>

      <div id="error-banner" style="display: none; background: #FEE2E2; color: #B91C1C; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.9rem;"></div>
      <div id="success-banner" style="display: none; background: #DCFCE7; color: #15803D; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

      <form id="review-form">
        <input type="hidden" id="booking-id-input">

        <div class="form-group" style="text-align: center;">
          <label class="form-label">How would you rate this expedition?</label>
          <div id="star-rating" style="font-size: 2.25rem; color: #CBD5E1; cursor: pointer; user-select: none;">
            <span data-value="1" style="cursor:pointer; display:inline-block; padding:0 0.15rem;"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span data-value="2" style="cursor:pointer; display:inline-block; padding:0 0.15rem;"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span data-value="3" style="cursor:pointer; display:inline-block; padding:0 0.15rem;"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span data-value="4" style="cursor:pointer; display:inline-block; padding:0 0.15rem;"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span data-value="5" style="cursor:pointer; display:inline-block; padding:0 0.15rem;"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          </div>
          <input type="hidden" id="rating-input" value="5">
        </div>

        <div class="form-group">
          <label for="comment" class="form-label">Tell us about your journey</label>
          <textarea id="comment" class="form-control" rows="4" placeholder="What was the highlight of your tour? How did your Kaitiaki guide connect you with the land?" required></textarea>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">Submit Review</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Kiwi Trails (Team Qubit). All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="/frontend/js/pages/review-form.js"></script>
</body>
</html>
